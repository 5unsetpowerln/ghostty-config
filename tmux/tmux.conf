# Additions to ~/.tmux.conf for the Ghostty setup.
# The pane swap also needs `focus-events on` (tmux-sensible sets it).

# Lets fish report the current directory to Ghostty through tmux
# (see fish/tmux-osc7-passthrough.fish).
set -g allow-passthrough on

# Ghostty pane swap: Ghostty sends User0 to the pane being moved, then focuses
# the neighbouring pane. ghostty-swap.sh swaps the sessions of the two clients.
set -s user-keys[0] "\e[5000~"
bind-key -n User0 run-shell -b "~/.tmux/ghostty-swap.sh '#{client_name}'"
set-hook -g client-focus-in "set -sF @ghostty-focus-client '#{hook_client}'"
